[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utcp-forge"
version = "0.1.0"
description = "AI-powered tool that investigates codebases with LangChain DeepAgent to synthesize UTCP manuals."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
agent = [
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
utcp-forge = "utcp_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/utcp_forge"]
